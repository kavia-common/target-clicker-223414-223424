spring.application.name=backend

# Server
server.port=3001
# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework

# H2 Database Configuration (in-memory)
# Notes:
# - DB_CLOSE_DELAY=-1 keeps the database alive for the lifetime of the JVM (prevents "Database is already closed").
# - DB_CLOSE_ON_EXIT=FALSE avoids shutdown side-effects in some environments/non-SIGINT exits.
# - JDBC URL documented in README along with console access: http://localhost:3001/h2-console
#   Console credentials: username=sa, password=(leave empty)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (enable web console for local development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
# Hibernate dialect is auto-detected for H2; do not set spring.jpa.database-platform explicitly
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Disable Open Session in View as requested
spring.jpa.open-in-view=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# CORS configuration
# Comma-separated list of allowed origins for browser requests. Defaults to local React dev server.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Devtools restart tuning:
# Avoid hot-reload loops by excluding build outputs and resources that continually change
spring.devtools.restart.exclude=static/**,public/**,META-INF/**,resources/**,**/*.jar,**/*.log,**/*.lock,**/*.tmp,**/*.swp,**/*~,\
build/**,out/**,target/**

# In some CI/preview environments, disable live reload server to avoid unexpected classpath triggers
spring.devtools.livereload.enabled=false
