spring.application.name=backend

# Server
server.port=3001
# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework

# H2 Database Configuration (in-memory)
# Use DB_CLOSE_DELAY=-1 to keep the database alive for the lifecycle of the JVM
# Use DB_CLOSE_ON_EXIT=FALSE to avoid shutdown side-effects in some environments
spring.datasource.url=jdbc:h2:mem:demo_db;MODE=LEGACY;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
# Let Hibernate choose the correct dialect for H2 automatically (do not set spring.jpa.database-platform explicitly)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
